# =============================================================================
#  CONFIGURAÇÃO DO GRUPO - preencha todos os campos marcados com TODO.
#  Este arquivo é lido pelo código base, pelo notebook e pelo script de
#  avaliação. Mantenha a estrutura (nomes das chaves) exatamente como está.
#  Veja um exemplo completo em exemplos/biblioteca/grupo.yaml.
# =============================================================================

grupo:
  nome: "Starbucks"
  integrantes:          # 3 a 4 integrantes
    - nome: "Vinicius dos Santos Boldan"
      rga: "202419050085"
    - nome: "Kimberlly Lauany Stachelski Canhete"
      rga: "202519060627"
    - nome: "Hytalo Maito Bassi"
      rga: "202419050166"

tema:
  nome: "Iniciação Cientifica e Monitoria"
  descricao: >
    Para estudantes da UFMS tirarem dúvidas sobre atiidades de extensão e monitoria, como valores de bolsas, onde consultar editais, etc.

dados:                  # caminhos relativos a este arquivo - não altere
  treino: dados/treino.csv
  teste: dados/teste.csv

modelos:                # caminhos relativos a este arquivo - não altere
  escopo: modelos/escopo.joblib
  tema: modelos/tema.joblib
  # carregador: "chatbot.meu_modulo:carregar"   # opcional; ver chatbot/modelos.py

# LLM que REDIGE as respostas do bot (via OpenRouter, com a chave do grupo).
# Os classificadores decidem a ROTA; o LLM só escreve o texto da resposta.
llm:
  modelo: "openai/gpt-6-luna"   # ou o modelo indicado pelo professor
  temperatura: 0.3                       # 0 = respostas mais estáveis; 1 = mais variadas
  max_tokens: 300
  usar_em: [intencoes, chitchat]         # nós em que o LLM redige a resposta
  persona: >
    Voce é Kitt, inteligencia artificial sarcástica, bem humorada e muito inteligente e bem informada que tem informações sobre iniciação cientifica e monitoria, com base em documentos e editais online da UFMS.
  contato: "boldan.vinicius@ufms.br"
  max_frases: 3
  turnos_historico: 3

# Base de conhecimento (RAG). Coloque os documentos oficiais do tema em
# documentos/ (uma subpasta por intenção + geral/). O índice vetorial é criado
# automaticamente em .vectordb/ na primeira conversa com o LLM.
conhecimento:
  pasta: documentos
  representacao: tfidf        # tfidf (padrão) ou embeddings
  tamanho_trecho: 700
  k: 4
  similaridade_minima: 0.05

roteamento:
  # Abaixo desta confiança no tema, o bot pede esclarecimento em vez de responder.
  # 0 desliga o recurso. Escolha o valor com base em dados e justifique no relatório.
  limiar_tema: 0.0

# De 5 a 10 intenções. O nome (chave) deve ter só letras minúsculas sem acento,
# dígitos e "_". "descricao" aparece nas mensagens do bot ("Posso ajudar com: ...").

intencoes:
  editais:
    descricao: >
      Posso ajudar a encontrar editais anteriores de iniciação científica
      e monitoria, além de esclarecer dúvidas sobre as regras e os
      procedimentos descritos nesses documentos.
    resposta: >
      Você pode consultar os editais de iniciação científica na página da
      PROPP: https://propp.ufms.br/category/editais-publicados/editais-iniciacao-cientifica/

      Para consultar os editais de monitoria, acesse a página da PROGRAD:
      https://prograd.ufms.br/category/editais/editais-monitoria/

  como_se_inscrever:
    descricao: >
      Posso esclarecer dúvidas sobre os processos de inscrição e seleção
      para iniciação científica e monitoria, com base nas informações
      disponíveis nos editais.
    resposta: >
      Para consultar informações sobre o processo seletivo de monitores
      voluntários de 2026, acesse o edital da PROGRAD:
      https://prograd.ufms.br/edital-no-21-2026-prograd-ufms-cadastro-de-propostas-de-plano-de-trabalho-do-programa-institucional-de-monitoria-voluntaria-na-ufms-em-2026/

      Para informações sobre iniciação científica, consulte o edital
      de 2025:
      https://propp.ufms.br/edital-pibic-pibic-af-pibiti-2025/

  como_sao_relatorios:
    descricao: >
      Posso esclarecer dúvidas sobre a estrutura, o formato e os modelos
      de relatórios de iniciação científica e monitoria.
    resposta: >
      Você pode consultar orientações e materiais de apoio para a elaboração
      de trabalhos acadêmicos, que podem auxiliar na preparação dos relatórios,
      no seguinte endereço:
      https://cpnv.ufms.br/cursos/administracao/guia-de-elaboracao-de-trabalhos-academicos/

  requisitos_minimos:
    descricao: >
      Posso esclarecer dúvidas sobre os requisitos para participar de
      atividades de monitoria, remunerada ou voluntária, e de projetos
      de iniciação científica.
    resposta: >
      Os requisitos de participação estão descritos nos editais de cada
      programa. Consulte os editais de iniciação científica na página da PROPP:
      https://propp.ufms.br/category/editais-publicados/editais-iniciacao-cientifica/

      Para consultar os requisitos dos programas de monitoria, acesse
      a página da PROGRAD:
      https://prograd.ufms.br/category/editais/editais-monitoria/

  bolsas_e_valores:
    descricao: >
      Posso esclarecer dúvidas sobre bolsas de iniciação científica
      e monitoria remunerada, incluindo valores e condições de participação,
      conforme as informações disponíveis nos editais.
    resposta: >
      Para consultar informações sobre bolsas e modalidades de monitoria,
      acesse os editais da PROGRAD:
      https://prograd.ufms.br/category/editais/editais-monitoria/

      Para informações sobre bolsas de iniciação científica, consulte
      os editais da PROPP:
      https://propp.ufms.br/category/editais-publicados/

# Respostas dos nós que não são intenções. {assuntos} vira a lista de descrições
# das intenções; {opcao1}/{opcao2}, as duas intenções mais prováveis.
respostas:
  chitchat:
    saudacao: "Saudações! Como posso ajudar?"
    agradecimento: "Não há por onde!"
    despedida: "Até logo! E caso eu não te veja: bom dia, boa tarde e boa noite!"
    padrao: "Sou um assistente automático e posso ajudar com: {assuntos}."
  fora_dominio: "Desculpe, não sei responder sobre isso. Posso ajudar com: {assuntos}."
  esclarecer: "Não tenho certeza se entendi. Sua dúvida é sobre {opcao1} ou sobre {opcao2}?"
